<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página personal de Brass, futuro game dev y creador de Mukigen"
    />

    <title>Página de Brass</title>
    <link rel="icon" type="image/png" href="images/contenent/Logotipo.png" />

    <link rel="stylesheet" href="Css/Style.css" />

    <style>
      .espiral {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        padding: 20px;
        border-radius: 10px;
        background-color: white;
        margin-bottom: 20px;
      }

      .espiral__canvas {
        width: 100%;
        max-width: 520px;
        aspect-ratio: 1 / 1;
        border: 6px solid rgb(52, 86, 87);
        border-radius: 25px;
        background-color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .espiral__boton {
        padding: 12px 26px;
        border: 0;
        border-radius: 10px;
        background-color: rgb(52, 86, 87);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
      }

      .espiral__boton:hover,
      .espiral__boton:focus-visible {
        background-color: rgb(0, 166, 255);
      }

      @media (max-width: 600px) {
        .espiral {
          padding: 15px;
        }
      }
    </style>
  </head>

  <a href="index.html">
    <header>
      <h1>Página de Brass dev</h1>
    </header></a
  >

  <section class="text-w-image">
    <h1>¿por que Gyro Zepelly es el rey del aura?</h1>
    <div>
      <p class="Normal-text">
        Ok, ok, ya se que la parte 7 de jojos es la mas larpeada y a la vez una
        de las mas conocidas por
      </p>
    </div>

    <section class="espiral">
      <h2>Espiral aurea</h2>
      <canvas
        id="espiral-aurea"
        class="espiral__canvas"
        width="520"
        height="520"
      >
        Tu navegador no soporta canvas.
      </canvas>
      <button id="dibujar-espiral" class="espiral__boton" type="button">
        Dibujar espiral
      </button>
    </section>
  </section>

  <script src="EspiralAurea.js" defer></script>
</html>
